<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <!-- Addinol Official Logo (White-Background Optimized) -->
  <defs>
    <linearGradient id="addinolRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E51A1A"/>
      <stop offset="100%" stop-color="#B80A0A"/>
    </linearGradient>
  </defs>

  <!-- Left Dynamic Triangle / Chevron Emblem -->
  <g transform="translate(8, 7)">
    <!-- Red dynamic chevron triangle -->
    <path d="M4 46 L24 4 L44 46 L33 46 L24 23 L15 46 Z" fill="url(#addinolRed)"/>
    <!-- Center bar -->
    <path d="M16 35 L32 35 L29 29 L19 29 Z" fill="#FFFFFF"/>
    <!-- Inner dynamic speed notch -->
    <path d="M21 4 L30 4 L14 46 L5 46 Z" fill="#FFFFFF" fill-opacity="0.4"/>
  </g>

  <!-- ADDINOL Wordmark (Deep Brand Charcoal/Black on White) -->
  <text x="62" y="41" font-family="'Plus Jakarta Sans', -apple-system, 'Arial Black', Impact, sans-serif" font-weight="900" font-size="34" fill="#0F172A" letter-spacing="1.5">ADDINOL</text>

  <!-- Subtitle Tagline -->
  <text x="63" y="55" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="8.5" fill="#DC2626" letter-spacing="3.2">THE ART OF OIL • GERMANY</text>
</svg>
